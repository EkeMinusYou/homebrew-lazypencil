name: Check Casks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check generated Cask syntax and Homebrew metadata
        shell: bash
        run: |
          shopt -s nullglob
          casks=(Casks/*.rb)
          if (( ${#casks[@]} == 0 )); then
            echo 'Waiting for the first signed upstream release.'
            exit 0
          fi
          brew tap ekeminusyou/lazypencil "$PWD"
          brew trust --cask ekeminusyou/lazypencil/lazypencil
          brew style "${casks[@]}"
          brew info --json=v2 --cask ekeminusyou/lazypencil/lazypencil >/dev/null
